[build]
  command = "pnpm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.25.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/g/:token"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
